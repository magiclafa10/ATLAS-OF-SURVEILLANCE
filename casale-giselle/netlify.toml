# Impostazioni di Netlify per casalegiselle.it
[build]
  publish = "site"
  functions = "netlify/functions"

# Indirizzo principale senza "www"
[[redirects]]
  from = "https://www.casalegiselle.it/*"
  to = "https://casalegiselle.it/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Le foto restano in memoria 7 giorni; testi, stili e script si ricontrollano sempre,
# così ogni modifica al sito si vede subito
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
